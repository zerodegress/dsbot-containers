# =============================================================================
# Reference deployment for podman compose / docker compose.
#
# Nothing is published on the host by default: dsh binds 127.0.0.1 inside the
# container and the way in is a sidecar that shares this container's network
# namespace (see below), or your own reverse proxy. To expose the port directly,
# set DSH_BIND_HOST=0.0.0.0 — the entrypoint probes the login gate and refuses
# to start if it is not answering.
# =============================================================================
services:
  dsbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Both layers share a base image; without TOOLS_IMAGE you get the
        # tool-less variant. See docs/architecture.md.
        TOOLS_IMAGE: dsbot-tools:bookworm
        DSH_VERSION: "0.2.0-rc.2"
        # forge:ds-bot-pin — the image carries ds-bot; a volume copy cannot win.
        DS_BOT_VERSION: "0.1.7"
        AUTH_GATE_VERSION: "0.17.4"
        # Installed as a pair; setting only one fails the build on purpose.
        INSTALL_SHUTUP: "1"
        INSTALL_AUTH_GATE: "1"
        # SHUTUP_REPO has no usable default: the build fetches that fork and
        # checks it against SHUTUP_SHA256, so a build without it stops there
        # (404). Uncomment the three and fill in your fork and its commit.
        # SHUTUP_REPO: https://github.com/your-org/dsh-shutup
        # SHUTUP_COMMIT: <40-hex commit id>
        # SHUTUP_SHA256: <sha256 of that commit's tarball>

    # DSBOT_IMAGE overrides the reference image; the default keeps the tag
    # convention (tag == the ds-bot version the image was built against).
    image: ${DSBOT_IMAGE:-dsbot-containers:0.1.7}
    container_name: dsbot
    # forge:grace-period — dsh stops through the entrypoint's TERM trap, which
    # then waits for it to quiesce; the 10s default is tight for a session flush.
    restart: unless-stopped
    stop_grace_period: 30s

    # Non-root with a read-only root: only /data and the two tmpfs are writable.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /run:mode=755,size=16m
    security_opt:
      - no-new-privileges:true
    # forge:podman-socket — the container is fixed to uid 10001 on a read-only
    # root, and the socket is a unix socket with mode 0660: group membership is
    # the whole requirement, no capability and no wider uid. On a rootless host
    # that group is the host user's:
    #   stat -c '%u:%g %a' /run/user/$(id -u)/podman/podman.sock
    # Uncomment with that gid. keep-id is what keeps supplementary groups when
    # the runtime would drop them; a :ro socket mount breaks it, because
    # connecting needs write permission on the socket file itself.
    # group_add:
    #   - "1000"
    # userns_mode: keep-id
    cap_drop: [ALL]

    environment:
      DSH_HOME: /data
      DSH_PORT: "3080"
      DSH_BIND_HOST: "127.0.0.1"
      # Behind a reverse proxy or a named tunnel host:
      # DSH_PUBLIC_URL: "https://bot.example.com/"
      # DSH_TRUSTED_HOST: "bot.example.com"
      # Debugging only:
      # SKIP_GATE_CHECK: "0"
      # OVERLAY_PLUGINS_STRICT: "0"
      # SKIP_OVERLAY_PLUGINS: "1"

    # Login token and provider keys arrive as a tmpfs file, never as env in
    # compose. See secrets.env.example.
    secrets:
      - dsh_env

    volumes:
      - dsbot-data:/data
      # The deployment layer: mounted read-only, applied last, overrides all.
      - ./overlay:/etc/dsbot/overlay:ro

    # To publish the port instead of using a sidecar, uncomment this and set
    # DSH_BIND_HOST=0.0.0.0 above. The login gate is then the only door.
    # ports:
    #   - "127.0.0.1:3080:3080"

  # cloudflared shares dsbot's network namespace, so 127.0.0.1:3080 is dsh.
  # Keep the tunnel's ingress rule pointed at http://127.0.0.1:3080.
  # cloudflared:
  #   image: docker.io/cloudflare/cloudflared:latest
  #   container_name: dsbot-tunnel
  #   restart: unless-stopped
  #   network_mode: "service:dsbot"
  #   depends_on: [dsbot]
  #   command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}

volumes:
  dsbot-data:

secrets:
  dsh_env:
    file: ./secrets.env
