# =============================================================================
# Reference deployment for podman compose / docker compose.
#
# Nothing is published on the host by default: dsh binds 127.0.0.1 inside the
# container and the way in is a sidecar that shares this container's network
# namespace (see below), or your own reverse proxy. To expose the port directly,
# set DSH_BIND_HOST=0.0.0.0 — the entrypoint probes the login gate and refuses
# to start if it is not answering.
# =============================================================================
services:
  dsbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Both layers share a base image; without TOOLS_IMAGE you get the
        # tool-less variant. See docs/architecture.md.
        TOOLS_IMAGE: dsbot-tools:bookworm
        DSH_VERSION: "0.2.0-rc.2"
        DS_BOT_VERSION: "0.1.6"
        AUTH_GATE_VERSION: "0.17.4"
        # Installed as a pair; setting only one fails the build on purpose.
        INSTALL_SHUTUP: "1"
        INSTALL_AUTH_GATE: "1"

    image: ghcr.io/zerodegress/dsbot-containers:0.1.6
    container_name: dsbot
    restart: unless-stopped

    # Non-root with a read-only root: only /data and the two tmpfs are writable.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /run:mode=755,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

    environment:
      DSH_HOME: /data
      DSH_PORT: "3080"
      DSH_BIND_HOST: "127.0.0.1"
      # Behind a reverse proxy or a named tunnel host:
      # DSH_PUBLIC_URL: "https://bot.example.com/"
      # DSH_TRUSTED_HOST: "bot.example.com"
      # Debugging only:
      # SKIP_GATE_CHECK: "0"
      # OVERLAY_PLUGINS_STRICT: "0"
      # SKIP_OVERLAY_PLUGINS: "1"

    # Login token and provider keys arrive as a tmpfs file, never as env in
    # compose. See secrets.env.example.
    secrets:
      - dsh_env

    volumes:
      - dsbot-data:/data
      # The deployment layer: mounted read-only, applied last, overrides all.
      - ./overlay:/etc/dsbot/overlay:ro

    # To publish the port instead of using a sidecar, uncomment this and set
    # DSH_BIND_HOST=0.0.0.0 above. The login gate is then the only door.
    # ports:
    #   - "127.0.0.1:3080:3080"

  # cloudflared shares dsbot's network namespace, so 127.0.0.1:3080 is dsh.
  # Keep the tunnel's ingress rule pointed at http://127.0.0.1:3080.
  # cloudflared:
  #   image: docker.io/cloudflare/cloudflared:latest
  #   container_name: dsbot-tunnel
  #   restart: unless-stopped
  #   network_mode: "service:dsbot"
  #   depends_on: [dsbot]
  #   command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:-}

volumes:
  dsbot-data:

secrets:
  dsh_env:
    file: ./secrets.env
