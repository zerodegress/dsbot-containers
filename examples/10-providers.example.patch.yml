# ============================================================================
# Deployment layer (example) — copy it into the mount at /etc/dsbot/overlay/;
# it is applied after every image layer, so it wins.
#
# Files are applied in name order: 10- before 20-. Copy this one to
# overlay/10-providers.patch.yml and edit it. The shipped examples live here in
# examples/ and are never mounted.
#
# Anything here is a normal dsh cordis patch — the same format the DSH settings
# UI writes, except this one is mounted read-only at the deployment layer and has
# the highest priority. Put provider keys in the secrets file, not here: name
# the environment variable with apiKeyEnv and let the entrypoint export it.
# ============================================================================

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      my-gateway:
        displayName: My Gateway
        apiKeyEnv: MY_GATEWAY_API_KEY
        api: openai-completions
        baseURL: https://api.example.com/v1
        models:
          - id: some-model
            name: Some Model
            contextWindow: 200000

# The model new sessions and new Bots start on.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: my-gateway
    model: some-model
