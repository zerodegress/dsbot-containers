# ============================================================================
# Image base layer, injected by the entrypoint as a CLI patch (`--patch`).
#
# Patch order, lowest to highest (later overrides earlier):
#   1. bundle layer, including every plugin the deployment layer installs
#   2. the volume profile layers: $DSH_HOME/profiles/web/cordis.patch.yml (the file
#      the DSH settings UI writes) and the machine-level $DSH_HOME/cordis.patch.yml
#   3. this file (image base)
#   4. the deployment layer: /etc/dsbot/overlay.yml and /etc/dsbot/overlay/*.patch.yml
#   5. the Bot's own layer: $DSH_HOME/patches/*.patch.yml
#   6. the bundled plugins' own bundle patches (shutup, the login gate)
#
# A deployment and the Bot both outrank this file; the bundled plugins' patches
# outrank everything below them. That is why this file may only hold two kinds of
# entries:
#   a. insert rows for plugins that ship in the image (ds-bot and its web-search,
#      the image skills provider)
#   b. config nobody is expected to change (here: the update check)
# Providers, default models, the web search provider and anything else a deployment
# or the Bot must be able to tune belong in layers 4 and 5.
# ============================================================================

# --- ds-bot and its web-search companion -------------------------------------
- insert:
    - id: bot
      name: ds-bot
    - id: web-search-auto
      name: ds-bot/web-search

# --- skills baked into the image ---------------------------------------------
# The image ships its own skills in /opt/dsh-skills and registers them through a
# second filesystem provider with its own id, so the directory is named here and
# not inside the agent preset's config (`customSkillDirs` there points at the
# preset's own skills and the Web editor may rewrite that row).
# includeDefaultRoots stays off: the preset's instance already scans the default
# roots, this one only adds `/opt/dsh-skills`, whose candidates rank as "custom"
# — a Bot can still outrank a baked-in skill with a same-named one in its
# workspace's `.dsh/skills` or `.agents/skills`.
- insert:
    - id: image-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: image-skills
        includeDefaultRoots: false
        customSkillDirs:
          - /opt/dsh-skills

# --- config that must not follow the volume ----------------------------------
# ds-bot's version follows the image; its self-update check cannot work on a
# read-only root anyway. Its config is a plain object, so this override does not
# drop any other key.
- id: bot
  config:
    updateCheck: false
