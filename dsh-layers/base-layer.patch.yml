# ============================================================================
# Image base layer, injected by the entrypoint as a CLI patch (`--patch`).
#
# Patch order, lowest to highest (later overrides earlier):
#   1. bundle layer, including every plugin the deployment layer installs
#   2. the volume profile: $DSH_HOME/profiles/web/cordis.patch.yml — this is the
#      file the DSH settings UI writes to
#   3. the deployment layer: /etc/dsbot/overlay.yml and /etc/dsbot/overlay/*.patch.yml
#   4. the image: this file, then the bundled plugins' own bundle patches (shutup
#      and the login gate)
#
# Everything the image carries is applied last, so no mounted patch can undo it.
# That is why this file may only hold two kinds of entries:
#   a. insert rows for plugins that ship in the image (ds-bot and its web-search)
#   b. config nobody is expected to change (here: the update check)
# Providers, default models, the web search provider and anything else a deployment
# must be able to tune belong in the deployment layer.
# ============================================================================

# --- ds-bot and its web-search companion -------------------------------------
- insert:
    - id: bot
      name: ds-bot
    - id: web-search-auto
      name: ds-bot/web-search

# --- config that must not follow the volume ----------------------------------
# ds-bot's version follows the image; its self-update check cannot work on a
# read-only root anyway. Its config is a plain object, so this override does not
# drop any other key.
- id: bot
  config:
    updateCheck: false
